<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Главное меню</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='styles/mainmenu-style.css') }}">
</head>
<body>
	<div class="main-panel">
		<h1 class="main-panel-title">Главное меню</h1>
		<ul class="main-panel-list">
			{% for key, section in sections.items() %}
				<li>
					<a href="{{ url_for(section.endpoint) }}" class="progress-item">
						<span class="progress-title">{{ section.title }}</span>
						<div class="progress-bar">
							<div class="progress-fill {% if section.total.completed == section.total.total %}completed{% endif %}" 
								style="width: {{ (section.total.completed / section.total.total * 100)|round(0) }}%;">
							</div>
						</div>
						<span class="progress-numbers">
							{{ section.total.completed }}/{{ section.total.total }}
						</span>
					</a>
				</li>
			{% endfor %}
		</ul>
	</div>
</body>
